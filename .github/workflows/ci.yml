name: CI - Tests & Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install backend dependencies
        run: npm ci

      - name: Build frontend (Vite -> frontend/dist)
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build

      - name: Initialize database
        run: |
          mkdir -p data
          echo "Database directory created"

      - name: Start server
        run: |
          # Start server in background and log output
          HOST=127.0.0.1 npm start > server.log 2>&1 &
          SERVER_PID=$!
          echo "Server PID: $SERVER_PID"
          
          # Wait for server to be ready (up to 60 seconds)
          for i in {1..60}; do
            if curl -s http://127.0.0.1:3000/api/health > /dev/null 2>&1; then
              echo "✅ Server is ready after $((i * 2)) seconds"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "⚠️ Server taking longer than expected..."
              cat server.log || true
            fi
            echo "⏳ Waiting for server... ($i/60)"
            sleep 2
          done
          
          # Verify server is responding
          echo "🔍 Checking server health..."
          curl -v http://127.0.0.1:3000/api/health || echo "❌ Server health check failed"
          
          # Save PID for later
          echo $SERVER_PID > server.pid

      - name: Run health check
        run: |
          echo "🔍 Running health check..."
          curl -s http://127.0.0.1:3000/api/health | jq . || echo "❌ Health check failed"

      - name: Stop server
        run: |
          echo "🛑 Stopping server..."
          if [ -f server.pid ]; then
            kill $(cat server.pid) || true
          fi
          pkill -f "src/index.js" || true
          echo "✅ Server stopped"
        if: always()

      - name: Upload server logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: server-logs
          path: server.log
          retention-days: 7

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            *.log
          retention-days: 7